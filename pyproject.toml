[project]
name = "dca-service"
version = "0.1.0"
description = "Institutional-grade Digital Custody Asset (DCA) as a Service platform"
authors = [
    { name = "google-labs-jules[bot]", email = "161369871+google-labs-jules[bot]@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "brotli-asgi>=1.6.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "bandit>=1.7.10",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "mypy>=1.15.0",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "ruff>=0.9.6",
]
