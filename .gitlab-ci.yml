# GitLab Pages CI/CD Pipeline
image: ruby:3.2

stages:
  - deploy

pages:
  stage: deploy
  before_script:
    - apt-get update -qq && apt-get install -y python3
    - python3 tools/generate_summary.py
    - gem install jekyll
  script:
    - jekyll build -d public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
