# Jekyll configuration for Digital Custody Asset (DCA) as a Service Platform
title: "Digital Custody Asset (DCA) as a Service Platform"
description: "Institutional-grade white-label & API-based Digital Asset Custody Platform governed by DSOM Protocol."
baseurl: "/proposal-deployment-base-on-blockchain"
url: "https://linuxmalaysia.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

kramdown:
  input: GFM
  hard_wrap: false

# Include specific root files and docs directory in site processing
include:
  - README.md
  - CHANGELOG.md
  - SUMMARY.md
  - HISTORY.md
  - favicon.ico
  - docs

# Exclude system and environment directories
exclude:
  - .venv
  - .agents
  - tools
  - tests
  - pyproject.toml
  - uv.lock
